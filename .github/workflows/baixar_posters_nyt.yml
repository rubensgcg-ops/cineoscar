name: Baixar Posters NYT 100 Definitivo

on:
  workflow_dispatch:

jobs:
  download-and-commit:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Baixar repositorio
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Executar script com titulos diretos
        run: |
          python -c "
          import os, json, urllib.request

          OUTPUT_DIR = 'posters_nyt'
          os.makedirs(OUTPUT_DIR, exist_ok=True)

          # Mapeamento com o título exato da página da Wikipedia em inglês
          DIRECT_MOVIES = [
              {'id': 18, 'page': 'Y_Tu_Mamá_También'},
              {'id': 41, 'page': 'Amélie'},
              {'id': 52, 'page': 'The_Favourite'},
              {'id': 67, 'page': 'Tár_(film)'}
          ]

          for m in DIRECT_MOVIES:
              path = f'{OUTPUT_DIR}/{m[\"id\"]}.jpg'
              url = f'https://en.wikipedia.org/api/rest_v1/page/summary/{m[\"page\"]}'
              
              try:
                  req = urllib.request.Request(url, headers={'User-Agent': 'CineNYTApp/5.0'})
                  with urllib.request.urlopen(req) as resp:
                      data = json.loads(resp.read().decode('utf-8'))
                      if 'thumbnail' in data and 'source' in data['thumbnail']:
                          img_url = data['thumbnail']['source']
                          
                          # Baixar a imagem
                          img_req = urllib.request.Request(img_url, headers={'User-Agent': 'Mozilla/5.0'})
                          with urllib.request.urlopen(img_req) as img_resp, open(path, 'wb') as f:
                              f.write(img_resp.read())
                          print(f'Sucesso ID {m[\"id\"]}')
                      else:
                          print(f'Thumbnail nao encontrada para ID {m[\"id\"]}')
              except Exception as e:
                  print(f'Erro ao baixar ID {m[\"id\"]}: {e}')
          "

      - name: Salvar posters no repositorio
        run: |
          git config --global user.name 'github-actions[bot]'
          git config --global user.email 'github-actions[bot]@users.noreply.github.com'
          git add posters_nyt/
          git commit -m "Corrige posters 18, 41, 52 e 67 via links diretos da Wikipedia" || exit 0
          git push
