name: Baixar Posters NYT 100 Definitivo

on:
  workflow_dispatch:

jobs:
  download-and-commit:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Baixar repositorio
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Executar script com URLs diretas
        run: |
          python -c "
          import os, urllib.request

          OUTPUT_DIR = 'posters_nyt'
          os.makedirs(OUTPUT_DIR, exist_ok=True)

          # URLs diretas e estáveis para os 4 filmes restantes
          DIRECT_URLS = {
              18: 'https://upload.wikimedia.org/wikipedia/en/3/3b/Y_tu_mam%C3%A1_tambi%C3%A9n_poster.jpg',
              41: 'https://upload.wikimedia.org/wikipedia/en/5/53/Amelie_poster.jpg',
              52: 'https://upload.wikimedia.org/wikipedia/en/d/dc/The_Favourite_%282018%29_official_poster.jpg',
              67: 'https://upload.wikimedia.org/wikipedia/en/6/62/T%C3%A1r_poster.jpg'
          }

          for movie_id, img_url in DIRECT_URLS.items():
              path = f'{OUTPUT_DIR}/{movie_id}.jpg'
              try:
                  req = urllib.request.Request(img_url, headers={'User-Agent': 'Mozilla/5.0'})
                  with urllib.request.urlopen(req) as resp, open(path, 'wb') as f:
                      f.write(resp.read())
                  print(f'Sucesso absoluto para o ID {movie_id}')
              except Exception as e:
                  print(f'Erro no ID {movie_id}: {e}')
          "

      - name: Salvar posters no repositorio
        run: |
          git config --global user.name 'github-actions[bot]'
          git config --global user.email 'github-actions[bot]@users.noreply.github.com'
          git add posters_nyt/
          git commit -m "Adiciona posters 18, 41, 52 e 67 via URLs diretas" || exit 0
          git push
