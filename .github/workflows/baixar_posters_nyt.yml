name: Baixar Posters NYT 100

on:
  workflow_dispatch:

jobs:
  download-and-commit:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Baixar repositorio
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Executar script de download NYT
        run: |
          python -c "
          import os, json, time, sys, urllib.request, urllib.parse
          sys.stdout.reconfigure(encoding='utf-8')

          OUTPUT_DIR = 'posters_nyt'
          os.makedirs(OUTPUT_DIR, exist_ok=True)

          MOVIES = [
              {'id': 1, 'wiki': 'Parasite_(2019_film)'},
              {'id': 2, 'wiki': 'Mulholland_Drive_(film)'},
              {'id': 3, 'wiki': 'There_Will_Be_Blood'},
              {'id': 4, 'wiki': 'In_the_Mood_for_Love'},
              {'id': 5, 'wiki': 'Moonlight_(2016_film)'},
              {'id': 6, 'wiki': 'No_Country_for_Old_Men_(film)'},
              {'id': 7, 'wiki': 'Eternal_Sunshine_of_the_Spotless_Mind'},
              {'id': 8, 'wiki': 'Get_Out'},
              {'id': 9, 'wiki': 'Spirited_Away'},
              {'id': 10, 'wiki': 'The_Social_Network'},
              {'id': 11, 'wiki': 'Mad_Max:_Fury_Road'},
              {'id': 12, 'wiki': 'The_Zone_of_Interest_(film)'},
              {'id': 13, 'wiki': 'Children_of_Men'},
              {'id': 14, 'wiki': 'Inglourious_Basterds'},
              {'id': 15, 'wiki': 'City_of_God_(2002_film)'},
              {'id': 16, 'wiki': 'Crouching_Tiger,_Hidden_Dragon'},
              {'id': 17, 'wiki': 'Brokeback_Mountain'},
              {'id': 18, 'wiki': 'Y_tu_mamá_también'},
              {'id': 19, 'wiki': 'Zodiac_(film)'},
              {'id': 20, 'wiki': 'The_Wolf_of_Wall_Street_(2013_film)'},
              {'id': 21, 'wiki': 'The_Royal_Tenenbaums'},
              {'id': 22, 'wiki': 'The_Grand_Budapest_Hotel'},
              {'id': 23, 'wiki': 'Boyhood_(2014_film)'},
              {'id': 24, 'wiki': 'Her_(film)'},
              {'id': 25, 'wiki': 'Phantom_Thread'},
              {'id': 26, 'wiki': 'Anatomy_of_a_Fall'},
              {'id': 27, 'wiki': 'Adaptation._(film)'},
              {'id': 28, 'wiki': 'The_Dark_Knight'},
              {'id': 29, 'wiki': 'Arrival_(film)'},
              {'id': 30, 'wiki': 'Lost_in_Translation_(film)'},
              {'id': 31, 'wiki': 'The_Departed'},
              {'id': 32, 'wiki': 'Bridesmaids_(2011_film)'},
              {'id': 33, 'wiki': 'A_Separation'},
              {'id': 34, 'wiki': 'WALL-E'},
              {'id': 35, 'wiki': 'A_Prophet'},
              {'id': 36, 'wiki': 'A_Serious_Man'},
              {'id': 37, 'wiki': 'Call_Me_by_Your_Name_(film)'},
              {'id': 38, 'wiki': 'Portrait_of_a_Lady_on_Fire'},
              {'id': 39, 'wiki': 'Lady_Bird_(film)'},
              {'id': 40, 'wiki': 'Yi_Yi'},
              {'id': 41, 'wiki': 'Amélie'},
              {'id': 42, 'wiki': 'The_Master_(2012_film)'},
              {'id': 43, 'wiki': 'Oldboy_(2003_film)'},
              {'id': 44, 'wiki': 'Once_Upon_a_Time_in_Hollywood'},
              {'id': 45, 'wiki': 'Moneyball_(film)'},
              {'id': 46, 'wiki': 'Roma_(2018_film)'},
              {'id': 47, 'wiki': 'Almost_Famous'},
              {'id': 48, 'wiki': 'The_Lives_of_Others'},
              {'id': 49, 'wiki': 'Before_Sunset'},
              {'id': 50, 'wiki': 'Up_(2009_film)'},
              {'id': 51, 'wiki': '12_Years_a_Slave_(film)'},
              {'id': 52, 'wiki': 'The_Favourite_(film)'},
              {'id': 53, 'wiki': 'Borat'},
              {'id': 54, 'wiki': 'Pan%27s_Labyrinth'},
              {'id': 55, 'wiki': 'Inception'},
              {'id': 56, 'wiki': 'Punch-Drunk_Love'},
              {'id': 57, 'wiki': 'Best_in_Show_(film)'},
              {'id': 58, 'wiki': 'Uncut_Gems'},
              {'id': 59, 'wiki': 'Toni_Erdmann'},
              {'id': 60, 'wiki': 'Whiplash_(2014_film)'},
              {'id': 61, 'wiki': 'Kill_Bill:_Volume_1'},
              {'id': 62, 'wiki': 'Memento_(film)'},
              {'id': 63, 'wiki': 'Little_Miss_Sunshine'},
              {'id': 64, 'wiki': 'Gone_Girl_(film)'},
              {'id': 65, 'wiki': 'Oppenheimer_(film)'},
              {'id': 66, 'wiki': 'Spotlight_(film)'},
              {'id': 67, 'wiki': 'Tár'},
              {'id': 68, 'wiki': 'The_Hurt_Locker'},
              {'id': 69, 'wiki': 'Under_the_Skin_(2013_film)'},
              {'id': 70, 'wiki': 'Let_the_Right_One_In_(film)'},
              {'id': 71, 'wiki': 'Ocean%27s_Eleven'},
              {'id': 72, 'wiki': 'Carol_(film)'},
              {'id': 73, 'wiki': 'Ratatouille_(film)'},
              {'id': 74, 'wiki': 'The_Florida_Project'},
              {'id': 75, 'wiki': 'Amour_(2012_film)'},
              {'id': 76, 'wiki': 'O_Brother,_Where_Art_Thou%3F'},
              {'id': 77, 'wiki': 'Everything_Everywhere_All_at_Once'},
              {'id': 78, 'wiki': 'Aftersun'},
              {'id': 79, 'wiki': 'The_Tree_of_Life_(film)'},
              {'id': 80, 'wiki': 'Volver_(2006_film)'},
              {'id': 81, 'wiki': 'Black_Swan_(film)'},
              {'id': 82, 'wiki': 'The_Act_of_Killing'},
              {'id': 83, 'wiki': 'Inside_Llewyn_Davis'},
              {'id': 84, 'wiki': 'Melancholia_(2011_film)'},
              {'id': 85, 'wiki': 'Anchorman:_The_Legend_of_Ron_Burgundy'},
              {'id': 86, 'wiki': 'Past_Lives_(film)'},
              {'id': 87, 'wiki': 'The_Lord_of_the_Rings:_The_Fellowship_of_the_Ring'},
              {'id': 88, 'wiki': 'The_Gleaners_and_I'},
              {'id': 89, 'wiki': 'Interstellar_(film)'},
              {'id': 90, 'wiki': 'Frances_Ha'},
              {'id': 91, 'wiki': 'Fish_Tank_(film)'},
              {'id': 92, 'wiki': 'Gladiator_(2000_film)'},
              {'id': 93, 'wiki': 'Michael_Clayton_(film)'},
              {'id': 94, 'wiki': 'Minority_Report_(film)'},
              {'id': 95, 'wiki': 'The_Worst_Person_in_the_World_(film)'},
              {'id': 96, 'wiki': 'Black_Panther_(film)'},
              {'id': 97, 'wiki': 'Gravity_(2013_film)'},
              {'id': 98, 'wiki': 'Grizzly_Man'},
              {'id': 99, 'wiki': 'Drive_(2011_film)'},
              {'id': 100, 'wiki': 'La_La_Land'}
          ]

          def get_image_url(wiki_title):
              try:
                  url = f'https://en.wikipedia.org/api/rest_v1/page/summary/{wiki_title}'
                  req = urllib.request.Request(url, headers={'User-Agent': 'CineNYTApp/2.0'})
                  with urllib.request.urlopen(req) as resp:
                      data = json.loads(resp.read().decode('utf-8'))
                      if 'thumbnail' in data and 'source' in data['thumbnail']:
                          return data['thumbnail']['source']
              except Exception:
                  pass
              return None

          for pass_num in range(1, 4):
              missing = [m for m in MOVIES if not (os.path.exists(f'{OUTPUT_DIR}/{m[\"id\"]}.jpg') and os.path.getsize(f'{OUTPUT_DIR}/{m[\"id\"]}.jpg') > 2000)]
              print(f'Rodada {pass_num}: Faltam {len(missing)} posters')
              if not missing: break

              for m in missing:
                  path = f'{OUTPUT_DIR}/{m[\"id\"]}.jpg'
                  img_url = get_image_url(m['wiki'])
                  if img_url:
                      try:
                          req = urllib.request.Request(img_url, headers={'User-Agent': 'Mozilla/5.0'})
                          with urllib.request.urlopen(req) as resp, open(path, 'wb') as f:
                              f.write(resp.read())
                          print(f'Salvo ID {m[\"id\"]}')
                      except Exception:
                          pass
                  time.sleep(1.0)
          "

      - name: Salvar posters no repositorio
        run: |
          git config --global user.name 'github-actions[bot]'
          git config --global user.email 'github-actions[bot]@users.noreply.github.com'
          git add posters_nyt/
          git commit -m "Salva posters NYT sem erros de encoding" || exit 0
          git push
