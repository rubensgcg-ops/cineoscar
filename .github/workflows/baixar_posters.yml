              {'id': 96, 'query': 'Oppenheimer film', 'title': 'Oppenheimer (film)'},
              {'id': 97, 'query': 'Anora film', 'title': 'Anora (film)'}
          ]

          def get_image_from_wiki_search(query_str):
              url = f'https://en.wikipedia.org/w/api.php?action=query&generator=search&gsrsearch={urllib.parse.quote(query_str)}&gsrlimit=1&prop=pageimages&format=json&pithumbsize=600'
              req = urllib.request.Request(url, headers={'User-Agent': 'CineOscar/2.0 (github.com/cineoscar)'})
              try:
                  with urllib.request.urlopen(req) as resp:
                      data = json.loads(resp.read().decode())
                      pages = data.get('query', {}).get('pages', {})
                      for pid in pages:
                          if 'thumbnail' in pages[pid]:
                              return pages[pid]['thumbnail']['source']
              except Exception as e:
                  pass
              return None

          def get_image_from_exact_title(title_str):
              url = f'https://en.wikipedia.org/w/api.php?action=query&titles={urllib.parse.quote(title_str)}&prop=pageimages&format=json&pithumbsize=600'
              req = urllib.request.Request(url, headers={'User-Agent': 'CineOscar/2.0 (github.com/cineoscar)'})
              try:
                  with urllib.request.urlopen(req) as resp:
                      data = json.loads(resp.read().decode())
                      pages = data.get('query', {}).get('pages', {})
                      for pid in pages:
                          if 'thumbnail' in pages[pid]:
                              return pages[pid]['thumbnail']['source']
              except Exception as e:
                  pass
              return None

          print('Iniciando o download de todos os posters...')
          downloaded = 0

          for m in MOVIES:
              path = f'{OUTPUT_DIR}/{m[\"id\"]}.jpg'
              
              if os.path.exists(path) and os.path.getsize(path) > 5000:
                  print(f'[{m[\"id\"]}/97] Ja existe no repositorio: {path}')
                  continue

              img_url = get_image_from_wiki_search(m['query']) or get_image_from_exact_title(m['title']) or get_image_from_exact_title(m['query'])

              if img_url:
                  try:
                      req = urllib.request.Request(img_url, headers={'User-Agent': 'Mozilla/5.0 (Windows NT 10.0; Win64; x64)'})
                      with urllib.request.urlopen(req) as resp, open(path, 'wb') as f:
                          f.write(resp.read())
                      print(f'[{m[\"id\"]}/97] Salvo com sucesso -> {path}')
                      downloaded += 1
                  except Exception as e:
                      print(f'[{m[\"id\"]}/97] Erro ao salvar imagem: {e}')
              else:
                  print(f'[{m[\"id\"]}/97] Poster nao encontrado para: {m[\"query\"]}')
              
              time.sleep(0.3)

          print(f'Processo concluido! Novas imagens baixadas: {downloaded}')
          "

      - name: Salvar posters no repositorio
        run: |
          git config --global user.name 'github-actions[bot]'
          git config --global user.email 'github-actions[bot]@users.noreply.github.com'
          git add posters/
          git commit -m "Salva todos os 97 posters na pasta local /posters" || exit 0
          git push
          
