name: Baixar Posters dos Filmes

on:
  workflow_dispatch:

jobs:
  download-and-commit:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Baixar repositorio
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Executar script com retentativas e delay
        run: |
          python -c "
          import os, json, time, urllib.request, urllib.parse

          OUTPUT_DIR = 'posters'
          os.makedirs(OUTPUT_DIR, exist_ok=True)

          MOVIES = [
              {'id': 1, 'wiki': 'Wings_(1927_film)'},
              {'id': 2, 'wiki': 'The_Broadway_Melody'},
              {'id': 3, 'wiki': 'All_Quiet_on_the_Western_Front_(1930_film)'},
              {'id': 4, 'wiki': 'Cimarron_(1931_film)'},
              {'id': 5, 'wiki': 'Grand_Hotel_(film)'},
              {'id': 6, 'wiki': 'Cavalcade_(1933_film)'},
              {'id': 7, 'wiki': 'It_Happened_One_Night'},
              {'id': 8, 'wiki': 'Mutiny_on_the_Bounty_(1935_film)'},
              {'id': 9, 'wiki': 'The_Great_Ziegfeld'},
              {'id': 10, 'wiki': 'The_Life_of_Emile_Zola'},
              {'id': 11, 'wiki': 'You_Can%27t_Take_It_with_You_(film)'},
              {'id': 12, 'wiki': 'Gone_with_the_Wind_(film)'},
              {'id': 13, 'wiki': 'Rebecca_(1940_film)'},
              {'id': 14, 'wiki': 'How_Green_Was_My_Valley_(film)'},
              {'id': 15, 'wiki': 'Mrs._Miniver_(film)'},
              {'id': 16, 'wiki': 'Casablanca_(film)'},
              {'id': 17, 'wiki': 'Going_My_Way'},
              {'id': 18, 'wiki': 'The_Lost_Weekend_(film)'},
              {'id': 19, 'wiki': 'The_Best_Years_of_Our_Lives'},
              {'id': 20, 'wiki': 'Gentleman%27s_Agreement_(film)'},
              {'id': 21, 'wiki': 'Hamlet_(1948_film)'},
              {'id': 22, 'wiki': 'All_the_King%27s_Men_(1949_film)'},
              {'id': 23, 'wiki': 'All_About_Eve'},
              {'id': 24, 'wiki': 'An_American_in_Paris_(film)'},
              {'id': 25, 'wiki': 'The_Greatest_Show_on_Earth_(film)'},
              {'id': 26, 'wiki': 'From_Here_to_Eternity_(film)'},
              {'id': 27, 'wiki': 'On_the_Waterfront'},
              {'id': 28, 'wiki': 'Marty_(film)'},
              {'id': 29, 'wiki': 'Around_the_World_in_80_Days_(1956_film)'},
              {'id': 30, 'wiki': 'The_Bridge_on_the_River_Kwai'},
              {'id': 31, 'wiki': 'Gigi_(1958_film)'},
              {'id': 32, 'wiki': 'Ben-Hur_(1959_film)'},
              {'id': 33, 'wiki': 'The_Apartment'},
              {'id': 34, 'wiki': 'West_Side_Story_(1961_film)'},
              {'id': 35, 'wiki': 'Lawrence_of_Arabia_(film)'},
              {'id': 36, 'wiki': 'Tom_Jones_(1963_film)'},
              {'id': 37, 'wiki': 'My_Fair_Lady_(film)'},
              {'id': 38, 'wiki': 'The_Sound_of_Music_(film)'},
              {'id': 39, 'wiki': 'A_Man_for_All_Seasons_(1966_film)'},
              {'id': 40, 'wiki': 'In_the_Heat_of_the_Night_(film)'},
              {'id': 41, 'wiki': 'Oliver!_(film)'},
              {'id': 42, 'wiki': 'Midnight_Cowboy'},
              {'id': 43, 'wiki': 'Patton_(film)'},
              {'id': 44, 'wiki': 'The_French_Connection_(film)'},
              {'id': 45, 'wiki': 'The_Godfather'},
              {'id': 46, 'wiki': 'The_Sting'},
              {'id': 47, 'wiki': 'The_Godfather_Part_II'},
              {'id': 48, 'wiki': 'One_Flew_Over_the_Cuckoo%27s_Nest_(film)'},
              {'id': 49, 'wiki': 'Rocky'},
              {'id': 50, 'wiki': 'Annie_Hall'},
              {'id': 51, 'wiki': 'The_Deer_Hunter'},
              {'id': 52, 'wiki': 'Kramer_vs._Kramer'},
              {'id': 53, 'wiki': 'Ordinary_People_(1980_film)'},
              {'id': 54, 'wiki': 'Chariots_of_Fire'},
              {'id': 55, 'wiki': 'Gandhi_(film)'},
              {'id': 56, 'wiki': 'Terms_of_Endearment_(film)'},
              {'id': 57, 'wiki': 'Amadeus_(film)'},
              {'id': 58, 'wiki': 'Out_of_Africa_(film)'},
              {'id': 59, 'wiki': 'Platoon_(film)'},
              {'id': 60, 'wiki': 'The_Last_Emperor'},
              {'id': 61, 'wiki': 'Rain_Man'},
              {'id': 62, 'wiki': 'Driving_Miss_Daisy_(film)'},
              {'id': 63, 'wiki': 'Dances_with_Wolves'},
              {'id': 64, 'wiki': 'The_Silence_of_the_Lambs_(film)'},
              {'id': 65, 'wiki': 'Unforgiven'},
              {'id': 66, 'wiki': 'Schindler%27s_List'},
              {'id': 67, 'wiki': 'Forrest_Gump'},
              {'id': 68, 'wiki': 'Braveheart'},
              {'id': 69, 'wiki': 'The_English_Patient_(film)'},
              {'id': 70, 'wiki': 'Titanic_(1997_film)'},
              {'id': 71, 'wiki': 'Shakespeare_in_Love'},
              {'id': 72, 'wiki': 'American_Beauty_(1999_film)'},
              {'id': 73, 'wiki': 'Gladiator_(2000_film)'},
              {'id': 74, 'wiki': 'A_Beautiful_Mind_(film)'},
              {'id': 75, 'wiki': 'Chicago_(2002_film)'},
              {'id': 76, 'wiki': 'The_Lord_of_the_Rings:_The_Return_of_the_King'},
              {'id': 77, 'wiki': 'Million_Dollar_Baby'},
              {'id': 78, 'wiki': 'Crash_(2004_film)'},
              {'id': 79, 'wiki': 'The_Departed'},
              {'id': 80, 'wiki': 'No_Country_for_Old_Men_(film)'},
              {'id': 81, 'wiki': 'Slumdog_Millionaire'},
              {'id': 82, 'wiki': 'The_Hurt_Locker'},
              {'id': 83, 'wiki': 'The_King%27s_Speech'},
              {'id': 84, 'wiki': 'The_Artist_(film)'},
              {'id': 85, 'wiki': 'Argo_(film)'},
              {'id': 86, 'wiki': '12_Years_a_Slave_(film)'},
              {'id': 87, 'wiki': 'Birdman_(film)'},
              {'id': 88, 'wiki': 'Spotlight_(film)'},
              {'id': 89, 'wiki': 'Moonlight_(2016_film)'},
              {'id': 90, 'wiki': 'The_Shape_of_Water_(film)'},
              {'id': 91, 'wiki': 'Green_Book_(film)'},
              {'id': 92, 'wiki': 'Parasite_(2019_film)'},
              {'id': 93, 'wiki': 'Nomadland_(film)'},
              {'id': 94, 'wiki': 'CODA_(2021_film)'},
              {'id': 95, 'wiki': 'Everything_Everywhere_All_at_Once'},
              {'id': 96, 'wiki': 'Oppenheimer_(film)'},
              {'id': 97, 'wiki': 'Anora_(film)'}
          ]

          def get_image_url(wiki_title):
              # Ttentativa 1: Wikipedia REST Summary API
              try:
                  url = f'https://en.wikipedia.org/api/rest_v1/page/summary/{wiki_title}'
                  req = urllib.request.Request(url, headers={'User-Agent': 'CineOscarApp/3.0 (contact@cineoscar.app)'})
                  with urllib.request.urlopen(req) as resp:
                      data = json.loads(resp.read().decode())
                      if 'thumbnail' in data and 'source' in data['thumbnail']:
                          return data['thumbnail']['source']
              except Exception:
                  pass

              # Tentativa 2: Wikipedia Query API
              try:
                  clean_title = urllib.parse.unquote(wiki_title).replace('_', ' ')
                  url = f'https://en.wikipedia.org/w/api.php?action=query&titles={urllib.parse.quote(clean_title)}&prop=pageimages&format=json&pithumbsize=600'
                  req = urllib.request.Request(url, headers={'User-Agent': 'CineOscarApp/3.0 (contact@cineoscar.app)'})
                  with urllib.request.urlopen(req) as resp:
                      data = json.loads(resp.read().decode())
                      pages = data.get('query', {}).get('pages', {})
                      for pid in pages:
                          if 'thumbnail' in pages[pid]:
                              return pages[pid]['thumbnail']['source']
              except Exception:
                  pass

              return None

          # Loop de ate 4 rodadas de retentativa
          for pass_num in range(1, 5):
              missing = [m for m in MOVIES if not (os.path.exists(f'{OUTPUT_DIR}/{m[\"id\"]}.jpg') and os.path.getsize(f'{OUTPUT_DIR}/{m[\"id\"]}.jpg') > 3000)]
              
              print(f'=== RODADA {pass_num}/4 === (Faltam {len(missing)} de {len(MOVIES)})')
              if not missing:
                  print('Todos os 97 posters ja foram baixados com sucesso!')
                  break

              for m in missing:
                  path = f'{OUTPUT_DIR}/{m[\"id\"]}.jpg'
                  img_url = get_image_url(m['wiki'])

                  if img_url:
                      try:
                          req = urllib.request.Request(img_url, headers={'User-Agent': 'Mozilla/5.0'})
                          with urllib.request.urlopen(req) as resp, open(path, 'wb') as f:
                              f.write(resp.read())
                          print(f'[{m[\"id\"]}/97] Baixado com sucesso!')
                      except Exception as e:
                          print(f'[{m[\"id\"]}/97] Erro ao salvar imagem: {e}')
                  else:
                      print(f'[{m[\"id\"]}/97] URL da foto nao encontrada nesta tentativa.')

                  # Timer para evitar Rate Limit
                  time.sleep(1.2)

              # Pausa maior entre rodadas
              if pass_num < 4 and len(missing) > 0:
                  print('Aguardando 5 segundos antes da proxima rodada...')
                  time.sleep(5)

          total_existentes = len([m for m in MOVIES if os.path.exists(f'{OUTPUT_DIR}/{m[\"id\"]}.jpg') and os.path.getsize(f'{OUTPUT_DIR}/{m[\"id\"]}.jpg') > 3000])
          print(f'STATUS FINAL: {total_existentes} de 97 posters estao salvos no repositorio!')
          "

      - name: Salvar posters no repositorio
        run: |
          git config --global user.name 'github-actions[bot]'
          git config --global user.email 'github-actions[bot]@users.noreply.github.com'
          git add posters/
          git commit -m "Salva todos os 97 posters na pasta local /posters" || exit 0
          git push
